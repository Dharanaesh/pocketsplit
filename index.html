<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TrackIt Pro</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#ffffff" id="meta-theme-color">
</head>
<body>
    <header>
        <h1 id="header-title">Dashboard</h1>
    </header>

    <main id="app-content">
        <!-- DASHBOARD VIEW -->
        <section id="view-dashboard" class="view active">
            <div class="card balance-card">
                <div class="balance-header">
                    <span>My Actual Spend</span>
                    <span class="month-label" id="dash-month-label">This Month</span>
                </div>
                <h2 id="dash-my-spend">₹0</h2>
                <div class="budget-progress">
                    <div class="progress-bar"><div class="progress-fill" id="budget-fill"></div></div>
                    <div class="budget-text">
                        <span id="budget-status">No budget set</span>
                    </div>
                </div>
                <div class="stats-row">
                    <div class="stat-box">
                        <span class="stat-label">Total Paid</span>
                        <span class="stat-val text-muted" id="dash-total-paid">₹0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Friends Owe Me</span>
                        <span class="stat-val text-green" id="dash-total-owed">₹0</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Analytics</h3>
                <div class="analytics-container">
                    <div class="pie-chart" id="category-pie"></div>
                    <div class="legend" id="category-legend"></div>
                </div>
            </div>
        </section>

        <!-- EXPENSES VIEW -->
        <section id="view-expenses" class="view">
            <div class="filter-row">
                <input type="month" id="expense-month-filter" onchange="renderExpenses()">
            </div>
            <div id="expense-list" class="list-container"></div>
            <button class="fab" onclick="openExpenseModal()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </section>

        <!-- MANAGE VIEW (Splits & Categories) -->
        <section id="view-manage" class="view">
            <div class="tabs-sub">
                <button class="sub-tab active" onclick="switchManageTab('friends', this)">Friends & Splits</button>
                <button class="sub-tab" onclick="switchManageTab('categories', this)">Categories</button>
            </div>
            
            <div id="manage-friends" class="sub-view active">
                <div class="flex-between mb-3">
                    <h3>Who Owes You?</h3>
                    <button class="btn-outline-small" onclick="openModal('modal-add-friend')">+ Add Friend</button>
                </div>
                <div id="splits-list" class="list-container"></div>
            </div>

            <div id="manage-categories" class="sub-view" style="display:none;">
                <div class="flex-between mb-3">
                    <h3>My Categories</h3>
                    <button class="btn-outline-small" onclick="openModal('modal-add-category')">+ Add Category</button>
                </div>
                <div id="categories-list" class="list-container"></div>
            </div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="view-settings" class="view">
            <div class="card">
                <h3>Preferences</h3>
                <div class="setting-item">
                    <span>Theme</span>
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="light">Light Mode</option>
                        <option value="dark">Dark Mode</option>
                    </select>
                </div>
                <div class="setting-item">
                    <span>Monthly Budget (₹)</span>
                    <input type="number" id="setting-budget" placeholder="e.g. 10000" onchange="saveBudget(this.value)">
                </div>
            </div>
            <div class="card">
                <h3>Data Sync</h3>
                <button class="btn secondary w-100 mb-2" onclick="exportData()">Export Backup (.json)</button>
                <label class="btn secondary w-100 text-center" style="display:block;">
                    Import Backup
                    <input type="file" accept=".json" style="display:none;" onchange="importData(event)">
                </label>
            </div>
        </section>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('dashboard', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
            <span>Dash</span>
        </button>
        <button class="nav-item" onclick="switchTab('expenses', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            <span>Expenses</span>
        </button>
        <button class="nav-item" onclick="switchTab('manage', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Manage</span>
        </button>
        <button class="nav-item" onclick="switchTab('settings', this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Settings</span>
        </button>
    </nav>

    <!-- MODALS -->
    <div id="modal-add-expense" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="expense-modal-title">Add Expense</h2>
                <button class="close-btn" onclick="closeModal('modal-add-expense')">&times;</button>
            </div>
            <form id="form-expense" onsubmit="handleExpenseSubmit(event)">
                <input type="hidden" id="exp-id">
                
                <div class="form-group">
                    <label>Total Amount Paid (₹)</label>
                    <input type="number" id="exp-amount" required min="1">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="exp-desc" placeholder="e.g. Dinner" required>
                </div>
                <div class="flex-row">
                    <div class="form-group w-50">
                        <label>Date</label>
                        <input type="date" id="exp-date" required>
                    </div>
                    <div class="form-group w-50">
                        <label>Category</label>
                        <select id="exp-category" required></select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="exp-is-split" onchange="renderSplitFriendsList()">
                        <strong>Split this with friends?</strong>
                    </label>
                </div>
                
                <div id="split-friends-container" style="display:none;" class="split-box">
                    <p class="text-muted mb-2 text-sm">Select who owes you and how much.</p>
                    <div id="split-friends-list"></div>
                    <div class="mt-2 text-sm text-primary">
                        Your actual spend will be: <strong id="calculated-my-spend">₹0</strong>
                    </div>
                </div>

                <button type="submit" class="btn primary w-100 mt-3">Save Expense</button>
            </form>
        </div>
    </div>

    <!-- Add Friend Modal -->
    <div id="modal-add-friend" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Friend</h2>
                <button class="close-btn" onclick="closeModal('modal-add-friend')">&times;</button>
            </div>
            <form onsubmit="handleAddFriend(event)">
                <div class="form-group">
                    <label>Friend's Name</label>
                    <input type="text" id="friend-name" required>
                </div>
                <button type="submit" class="btn primary w-100">Save</button>
            </form>
        </div>
    </div>

    <!-- Add Category Modal -->
    <div id="modal-add-category" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Category</h2>
                <button class="close-btn" onclick="closeModal('modal-add-category')">&times;</button>
            </div>
            <form onsubmit="handleAddCategory(event)">
                <div class="form-group">
                    <label>Category Name</label>
                    <input type="text" id="category-name" required>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="category-color" value="#007aff" required>
                </div>
                <button type="submit" class="btn primary w-100">Save</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
